[package]
name = "zkvm-wasm-runner"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.4"
rand = "0.8.5"
wat = "1.0"
zk-engine = { git = "https://github.com/ICME-Lab/zkEngine_dev", branch = "arecibo-wyatt" }
js-sys = "0.3"
wee_alloc = "0.4"
nova-snark = { git = "https://github.com/ICME-Lab/Nova/", branch = "feat/delegated-spartan", package = "nova-snark" }
ff = "0.13.1"
web-sys = { version = "0.3", features = ["console"] }
halo2curves = { git = "https://github.com/ICME-Lab/halo2curves", branch = "main", features = ["bits", "derive_serde"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
